# ---------------------------------------------------------------------------
# CodeDeploy AppSpec for the ECS blue/green deployment of sample-app.
#
# deploy/lib/create-deployment.sh renders this file (there is no
# CodePipeline): it replaces <TASK_DEFINITION_ARN> with the ARN of the task
# definition it just registered and fails if any placeholder remains.
#
# NetworkConfiguration is omitted, so the ECS service's network configuration
# (private subnets, ECS security group) carries over to the new task set.
# ---------------------------------------------------------------------------
version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: <TASK_DEFINITION_ARN>
        LoadBalancerInfo:
          ContainerName: "sample-app"
          ContainerPort: 8080
        PlatformVersion: "LATEST"
